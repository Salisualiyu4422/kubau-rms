<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#153b32">
  <meta name="description" content="KUB-ISMIS frontend prototype for digital secretariat and local government management.">
  <title>KUB-ISMIS | Kubau LGA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body class="app-body">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <a href="#dashboard" class="brand-lockup" data-page="dashboard">
        <span class="brand-seal"><i class="fa-solid fa-landmark"></i></span>
        <span><strong>KUBAU LGA</strong><small>Digital Secretariat</small></span>
      </a>
      <div class="workspace-tag"><span class="pulse"></span> PROTOTYPE WORKSPACE</div>
      <nav class="side-nav" id="side-nav"></nav>
      <div class="sidebar-bottom">
        <div class="support-card"><span class="support-icon"><i class="fa-regular fa-circle-question"></i></span><div><strong>Need assistance?</strong><small>Contact system support</small></div><button class="icon-button" data-toast="Support contact details are not connected in this prototype." aria-label="Support information"><i class="fa-solid fa-arrow-up-right-from-square"></i></button></div>
        <button class="collapse-button" id="collapse-sidebar"><i class="fa-solid fa-angles-left"></i><span>Collapse sidebar</span></button>
      </div>
    </aside>
    <div class="mobile-scrim" id="mobile-scrim"></div>
    <main class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-button mobile-menu" id="mobile-menu" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
          <div class="breadcrumb"><span>KUB-ISMIS</span><i class="fa-solid fa-chevron-right"></i><strong id="breadcrumb-current">Dashboard</strong></div>
        </div>
        <div class="topbar-actions">
          <div class="top-search"><i class="fa-solid fa-magnifying-glass"></i><input id="global-search" type="search" placeholder="Search records..." aria-label="Search records"><kbd>⌘ K</kbd><span id="global-search-results" class="global-search-results"></span></div>
          <button class="icon-button top-action" id="message-button" aria-label="Messages" data-toast="You are all caught up on messages."><i class="fa-regular fa-envelope"></i><span class="icon-dot"></span></button>
          <div class="dropdown-wrap">
            <button class="icon-button top-action" id="notification-button" aria-label="Notifications"><i class="fa-regular fa-bell"></i><span class="notification-count">4</span></button>
            <div class="dropdown-panel notification-panel" id="notification-panel">
              <div class="dropdown-heading"><div><strong>Notifications</strong><small>4 unread updates</small></div><button class="text-button" id="mark-read">Mark all read</button></div>
              <div class="notification-list">
                <button class="notification-item" data-page="memos"><span class="notice-symbol amber"><i class="fa-regular fa-file-lines"></i></span><span><strong>Memo awaiting approval</strong><small>KUB-M-0248 · Finance · 12 min ago</small></span><i class="unread-dot"></i></button>
                <button class="notification-item" data-page="revenue"><span class="notice-symbol green"><i class="fa-solid fa-chart-line"></i></span><span><strong>Revenue report submitted</strong><small>October daily summary · 48 min ago</small></span><i class="unread-dot"></i></button>
                <button class="notification-item" data-page="directives"><span class="notice-symbol blue"><i class="fa-solid fa-list-check"></i></span><span><strong>Directive deadline approaching</strong><small>KUB-D-018 · due tomorrow</small></span><i class="unread-dot"></i></button>
                <button class="notification-item" data-page="complaints"><span class="notice-symbol rose"><i class="fa-regular fa-message"></i></span><span><strong>New citizen complaint</strong><small>Roads · Anchau ward · 1 hr ago</small><i class="unread-dot"></i></button>
              </div>
              <button class="dropdown-footer" data-page="audit">View activity centre <i class="fa-solid fa-arrow-right"></i></button>
            </div>
          </div>
          <span class="topbar-date" id="current-date"></span>
          <div class="dropdown-wrap profile-wrap">
            <button class="profile-trigger" id="profile-button"><span class="avatar avatar-admin">AA</span><span class="profile-label"><strong>Administrator</strong><small>System Admin</small></span><i class="fa-solid fa-chevron-down"></i></button>
            <div class="dropdown-panel profile-panel" id="profile-panel">
              <button data-page="profile"><i class="fa-regular fa-user"></i> My profile</button>
              <button data-page="settings"><i class="fa-solid fa-sliders"></i> Settings</button>
              <button id="logout-button"><i class="fa-solid fa-arrow-right-from-bracket"></i> Sign out</button>
            </div>
          </div>
        </div>
      </header>
      <section class="page-content" id="page-content" aria-live="polite"></section>
      <footer class="app-footer"><span>Kubau LGA Digital Secretariat &amp; Management Information System</span><span>Frontend Prototype <b>·</b> © 2026 Kubau LGA</span></footer>
    </main>
  </div>
  <div class="modal-host" id="modal-host"></div>
  <div class="toast-region" id="toast-region" aria-live="polite"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js" defer></script>
</body>
</html>
